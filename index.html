        <section class="card" aria-labelledby="a5"><h2 id="a5">使用方式</h2>
          <ol>
            <li>在「股票總覽」或右上角搜尋框選擇股票（搜尋只作用於目前載入的資料）。</li>
            <li>在「個股分析」切換 1 個月到 1 年的期間、開關 MA5／MA20／MA60，並查看 RSI、MACD 與成交量。</li>
            <li>點擊綜合評分卡查看各項得分與理由，按 ☆ 加入觀察清單。</li>
            <li>在「智慧選股」設定條件後執行篩選，點擊結果即可查看個股。</li>
            <li>在「股票比較」選擇兩至三檔股票並排比較。</li>
            <li>在「資料匯入」上傳自己的 CSV 歷史資料。</li>
          </ol>
        </section>
        <section class="card" aria-labelledby="a6"><h2 id="a6">參考資料來源</h2>
          <p>可以自行從下列公開來源取得歷史股價，整理成上述 CSV 格式後匯入；實際使用應遵守各來源的使用條件。</p>
          <ul>
            <li><a href="https://www.twse.com.tw/" target="_blank" rel="noopener noreferrer">臺灣證券交易所（TWSE）</a></li>
            <li><a href="https://www.tpex.org.tw/" target="_blank" rel="noopener noreferrer">證券櫃檯買賣中心（TPEx）</a></li>
            <li><a href="https://data.gov.tw/" target="_blank" rel="noopener noreferrer">政府資料開放平臺</a></li>
          </ul>
          <p>部分來源的日期採民國年、數字含千分位：匯入前請把日期轉為 YYYY-MM-DD；含千分位的數字用雙引號包住即可正確讀取。</p>
        </section>
        <section class="card" aria-labelledby="a7"><h2 id="a7">技術架構與限制</h2>
          <ul>
            <li>單一 index.html：HTML5、CSS3、JavaScript ES6+，圖表以 Canvas 自行繪製。不使用外部程式庫、字型或 CDN，沒有外部網路依賴，可直接部署到 GitHub Pages。</li>
            <li>不需要後端伺服器、帳號系統、資料庫或付費 API，頁面中沒有任何 API Key。</li>
            <li>觀察清單以 LocalStorage 儲存股票代號；CSV 以 File API 在瀏覽器內讀取，不會上傳。</li>
            <li>第一版不處理除權息與股票分割，假設匯入價格已採一致的調整口徑。</li>
          </ul>
        </section>
        <section class="card" aria-labelledby="a8"><h2 id="a8">免責聲明</h2>
          <p>StockLens 提供的分析評分僅供教學、研究及資訊整理用途，不構成投資建議，也不保證投資獲利。</p>
        </section>
      </div>`;
  }

  /* ==========================================================================
     事件
     ========================================================================== */
  const ACTIONS = {
    watch: (t) => toggleWatch(t.dataset.code),
    'watch-clear': () => openModal('清空觀察清單', `<p style="color:var(--text-2)">要移除觀察清單中的 ${state.watch.length} 檔股票嗎？這個動作無法復原。</p>
      <div class="result-actions" style="margin-top:16px"><button type="button" class="btn btn-primary" data-action="watch-clear-confirm">清空清單</button><button type="button" class="btn" data-action="modal-close">取消</button></div>`),
    'watch-clear-confirm': () => {
      const codes = state.watch.slice();
      state.watch = [];
      saveWatch(); updateWatchCount(); closeModal();
      codes.forEach(refreshStars);
      if (state.route.view === 'watchlist') renderWatchlist();
      toast('已清空觀察清單');
    },
    period: (t) => { state.period = t.dataset.period; applyPeriod(); },
    ma: (t) => toggleMA(+t.dataset.ma),
    'score-detail': (t) => scoreDetail(t.dataset.code),
    'compare-add': (t) => compareAdd(t.dataset.code),
    'compare-toggle': (t) => compareToggle(t.dataset.code),
    'compare-period': (t) => { state.comparePeriod = t.dataset.period; renderCompareBody(); },
    'export-csv': (t) => exportCSV(t.dataset.code),
    preset: (t) => applyPreset(t.dataset.preset),
    'screener-reset': () => resetScreener(),
    sort: (t) => toggleSort(t.dataset.key),
    'pick-file': () => $('#fileInput').click(),
    'import-run': () => doImport(),
    'import-clear': () => { state.draft = emptyDraft(state.draft.unit); state.lastResult = null; renderImport(); },
    'import-remove': (t) => removeImported(t.dataset.code),
    'sample-download': (t) => {
      const s = SAMPLES.find((x) => x.key === t.dataset.sample);
      if (!s) return;
      download(s.file, sampleText(s.key));
      toast(`已下載 ${esc(s.file)}`);
    },
    'sample-load': (t) => loadSample(t.dataset.sample),
    'modal-close': () => closeModal()
  };
  function onClick(e) {
    const t = e.target.closest('[data-action]');
    if (t) { const fn = ACTIONS[t.dataset.action]; if (fn) fn(t, e); return; }
    const opt = e.target.closest('#searchList li[data-code]');
    if (opt) { openFromSearch(opt.dataset.code); return; }
    const tr = e.target.closest('tr[data-href]');
    if (tr && !e.target.closest('a, button, input, select, label')) go(tr.dataset.href);
  }
  function onKey(e) {
    const modalOpen = !$('#modal').hidden;
    if (modalOpen && e.key === 'Escape') { closeModal(); return; }
    if (modalOpen && e.key === 'Tab') {
      const f = $$('#modal button, #modal a[href], #modal input, #modal select').filter((x) => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      return;
    }
    if (e.key === '/' && !modalOpen && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      $('#searchInput').focus();
    }
  }
  function onSearchKey(e) {
    const n = search.results.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!n) return; search.active = (search.active + 1) % n; renderSearch(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (!n) return; search.active = search.active <= 0 ? n - 1 : search.active - 1; renderSearch(); }
    else if (e.key === 'Enter') { e.preventDefault(); submitSearch(); }
    else if (e.key === 'Escape') { closeSearch(); }
  }
  function onChange(e) {
    const t = e.target;
    if (t.id === 'stockPicker') go('#/stock/' + enc(t.value));
    else if (t.id === 'sortSel') { const [key, dir] = t.value.split(':'); state.sort = { key, dir }; renderResults(false); }
    else if (t.id === 'impUnit') state.draft.unit = t.value;
  }
  function onInput(e) {
    const t = e.target;
    if (t.closest && t.closest('#screenerForm')) onScreenerInput(e);
    else if (t.id === 'impCode') { state.draft.code = t.value; state.draft.autoFilled = false; }
    else if (t.id === 'impName') { state.draft.name = t.value; state.draft.autoFilled = false; }
  }
  function bindGlobal() {
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('submit', (e) => { if (e.target.id === 'screenerForm') { e.preventDefault(); runScreener(); } });
    const si = $('#searchInput');
    si.addEventListener('input', () => { search.active = -1; renderSearch(); });
    si.addEventListener('focus', () => { if (si.value.trim()) renderSearch(); });
    si.addEventListener('keydown', onSearchKey);
    si.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== si) closeSearch(); }, 160));
    $('#searchList').addEventListener('mousedown', (e) => e.preventDefault());
    $('#searchBtn').addEventListener('click', submitSearch);
    $('#fileInput').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) readFile(f); e.target.value = ''; });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());
    $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    window.addEventListener('hashchange', render);
  }

  function init() {
    loadDemo();
    loadWatch();
    updateBanner();
    updateWatchCount();
    updateNavStock();
    bindGlobal();
    if (!location.hash) {
      try { history.replaceState(null, '', '#/overview'); } catch (e) { /* file:// 等環境可忽略 */ }
    }
    render();
  }

  // 供測試與除錯使用的唯讀介面
  window.StockLens = { state, applyFilters, allStocks, searchStocks, version: '1.0.0' };
  init();
})();

</script>
