<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="StockLens 智慧選股分析平台：K 線圖、MA／RSI／MACD／成交量指標、規則式綜合評分、條件選股、股票比較、觀察清單與 CSV 匯入。示範資料為模擬，不構成投資建議。">
<meta name="theme-color" content="#0a1020">
<title>StockLens｜智慧選股分析平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1020'/%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%233cc8ea' stroke-width='2.4'/%3E%3Cpath d='M20.8 20.8 26.5 26.5' stroke='%233cc8ea' stroke-width='3' stroke-linecap='round'/%3E%3Crect x='9' y='12' width='2.4' height='5' fill='%232fc38c'/%3E%3Crect x='12.8' y='9.5' width='2.4' height='6.5' fill='%23ff5b61'/%3E%3Crect x='16.6' y='11' width='2.4' height='4.5' fill='%23ff5b61'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0a1020;
  --surface: #101a2e;
  --surface-2: #15213a;
  --surface-3: #1c2a48;
  --line: #22314f;
  --line-strong: #2f4270;
  --text: #e9eef8;
  --text-2: #a9b6cd;
  --text-3: #7f8ea9;
  --accent: #3cc8ea;
  --accent-ink: #04212c;
  --accent-soft: rgba(60, 200, 234, 0.12);
  --blue: #6ea9ff;
  --up: #ff5b61;
  --down: #2fc38c;
  --flat: #a9b6cd;
  --warn: #f3b94d;
  --warn-soft: rgba(243, 185, 77, 0.1);
  --ma5: #f3b94d;
  --ma20: #3cc8ea;
  --ma60: #c38dff;
  --c-trend: #3cc8ea;
  --c-rsi: #c38dff;
  --c-macd: #6ea9ff;
  --c-vol: #f3b94d;
  --radius-lg: 14px;
  --radius: 10px;
  --shadow: 0 14px 34px -22px rgba(0, 0, 0, 0.9);
  --maxw: 1320px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
[data-band="strong"] { --band-color: #46d5f3; }
[data-band="bull"] { --band-color: #6ea9ff; }
[data-band="neutral"] { --band-color: #a3afc4; }
[data-band="weak"] { --band-color: #e2a955; }
[data-band="bear"] { --band-color: #d08a55; }
[data-band="na"] { --band-color: #5c6a85; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 140px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 var(--font); min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body.modal-open { overflow: hidden; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.3; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: 0.2px; }
h2 { font-size: 16.5px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num, .tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 100; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 8px; font-weight: 600; }
.skip:focus { top: 8px; }

/* ---------- 頂部 ---------- */
.topbar { position: sticky; top: 0; z-index: 40; background: rgba(10, 16, 32, 0.95); backdrop-filter: saturate(140%) blur(10px); -webkit-backdrop-filter: saturate(140%) blur(10px); }
.topbar-inner { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; height: 62px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 18.5px; letter-spacing: 0.2px; flex: none; }
.brand svg { width: 30px; height: 30px; }
.mainnav { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.mainnav::-webkit-scrollbar { display: none; }
.mainnav a { color: var(--text-2); text-decoration: none; padding: 7px 11px; border-radius: 8px; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.mainnav a:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
.mainnav a.active { color: var(--accent); background: var(--accent-soft); }
.nav-count { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--surface-3); color: var(--text); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.nav-count:empty { display: none; }
.search { position: relative; flex: none; width: 270px; }
.search input { width: 100%; height: 38px; padding: 0 40px 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); outline: none; font-size: 14px; }
.search input::placeholder { color: var(--text-3); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input::-webkit-search-cancel-button { display: none; }
.search-btn { position: absolute; right: 4px; top: 4px; width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: transparent; color: var(--text-2); border-radius: 7px; cursor: pointer; }
.search-btn:hover { color: var(--text); background: var(--surface-3); }
.search-pop { position: absolute; right: 0; top: calc(100% + 6px); width: max(100%, 300px); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.9); padding: 6px; z-index: 50; }
.search-pop ul { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow: auto; }
.search-pop li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.search-pop li[aria-selected="true"], .search-pop li:hover { background: var(--surface-3); }
.search-pop li .code { font-weight: 650; min-width: 46px; font-variant-numeric: tabular-nums; }
.search-pop li .src { margin-left: auto; font-size: 12px; color: var(--text-3); }
.search-empty { padding: 10px 12px; font-size: 13.5px; color: var(--text-2); }
.search-empty strong { color: var(--text); display: block; margin-bottom: 2px; }

.demo-banner { background: var(--warn-soft); border-bottom: 1px solid rgba(243, 185, 77, 0.28); color: #f6d193; font-size: 13px; }
.demo-banner .wrap { display: flex; align-items: center; gap: 8px; padding-top: 6px; padding-bottom: 6px; }
.demo-banner strong { color: var(--warn); font-weight: 650; }
.demo-banner svg { flex: none; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding-left: 24px; padding-right: 24px; }
main { padding-top: 22px; padding-bottom: 48px; }
.view { animation: none; }

/* ---------- 共用元件 ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 4px 0 18px; flex-wrap: wrap; }
.lede { color: var(--text-2); margin-top: 4px; max-width: 72ch; }
.head-meta { color: var(--text-2); font-size: 13.5px; }
.head-meta strong { color: var(--text); font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
.card + .card, .stack > * + * { margin-top: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-sub { color: var(--text-3); font-size: 13px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.grid-2 > .card + .card { margin-top: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); font-size: 14px; font-weight: 550; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: #3f5a92; background: var(--surface-3); }
.btn-primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 650; }
.btn-primary:hover { background: #63d6f0; border-color: transparent; }
.btn-ghost { background: transparent; }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn[aria-pressed="true"].star-btn { color: var(--warn); border-color: rgba(243, 185, 77, 0.45); background: var(--warn-soft); }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-3); cursor: pointer; font-size: 17px; line-height: 1; }
.icon-btn:hover { color: var(--text); background: var(--surface-3); }
.icon-btn[aria-pressed="true"] { color: var(--warn); }
.link { font-size: 13.5px; text-decoration: none; }
.link:hover { text-decoration: underline; }
.select { height: 36px; padding: 0 30px 0 10px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface-2); cursor: pointer; }

.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--bg); gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--text-2); height: 28px; padding: 0 11px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 550; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line-strong); color: var(--text-2); white-space: nowrap; }
.badge-demo { color: var(--warn); border-color: rgba(243, 185, 77, 0.4); background: var(--warn-soft); }
.badge-csv { color: var(--blue); border-color: rgba(110, 169, 255, 0.4); background: rgba(110, 169, 255, 0.1); }

.chg { font-variant-numeric: tabular-nums; white-space: nowrap; }
.chg.up, .up { color: var(--up); }
.chg.down, .down { color: var(--down); }
.chg.flat, .flat { color: var(--flat); }
.chg.na { color: var(--text-3); }

.score-pill { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.score-pill b { color: var(--band-color); font-size: 15.5px; font-weight: 700; }
.score-pill small { color: var(--text-2); font-size: 12px; }
.score-pill.na b { color: var(--text-3); font-size: 13px; font-weight: 500; }

.table-wrap { position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.table th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--text-3); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 11px 12px; border-bottom: 1px solid rgba(34, 49, 79, 0.65); vertical-align: middle; white-space: nowrap; }
.table tbody tr:last-child td { border-bottom: 0; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table tr[data-href] { cursor: pointer; }
.table tbody tr:hover td { background: rgba(255, 255, 255, 0.025); }
.table .sticky-col { position: sticky; left: 0; z-index: 1; background: var(--surface); }
.table tbody tr:hover td.sticky-col { background: #141f35; }
.modal .table .sticky-col { background: var(--surface); }
.table .stock-cell a { color: var(--text); text-decoration: none; font-weight: 600; }
.table .stock-cell a:hover { color: var(--accent); }
.table .stock-cell .nm { color: var(--text-2); font-weight: 400; margin-left: 6px; }
.th-sort { border: 0; background: transparent; color: inherit; font: inherit; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.th-sort:hover { color: var(--text); }
.th-sort .ind { font-size: 10px; opacity: 0.45; }
th[aria-sort="ascending"] .th-sort, th[aria-sort="descending"] .th-sort { color: var(--accent); }
th[aria-sort="ascending"] .ind, th[aria-sort="descending"] .ind { opacity: 1; }

.empty { text-align: center; padding: 34px 16px; color: var(--text-2); }
.empty p + p { margin-top: 4px; }
.empty .btn { margin-top: 14px; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text-2); }
.notice.warn { border-color: rgba(243, 185, 77, 0.35); background: var(--warn-soft); color: #f6d193; }
.notice.error { border-color: rgba(255, 91, 97, 0.4); background: rgba(255, 91, 97, 0.08); color: #ffc2c4; }
.notice.ok { border-color: rgba(60, 200, 234, 0.4); background: var(--accent-soft); color: #bdeefa; }

.spark { display: block; }
.spark.up { color: var(--up); } .spark.down { color: var(--down); } .spark.flat { color: var(--flat); }

/* ---------- 總覽 ---------- */
.lens .card-head { margin-bottom: 4px; }
.strip { padding: 4px 26px 0; }
.strip-inner { position: relative; }
.strip-dots { position: relative; margin-top: 18px; }
.dot { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 1px 3px 3px; border-radius: 7px; text-decoration: none; color: var(--text); z-index: 1; }
.dot i { width: 12px; height: 12px; border-radius: 50%; background: var(--band-color); box-shadow: 0 0 0 3px var(--surface); transition: transform 0.12s; }
.dot-label { font-size: 12px; line-height: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
.dot:hover i, .dot:focus-visible i { transform: scale(1.3); }
.dot:hover, .dot:focus-visible { z-index: 3; }
.dot-tip { display: none; position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--surface-3); border: 1px solid var(--line-strong); padding: 4px 8px; border-radius: 7px; font-size: 12px; font-weight: 500; pointer-events: none; }
.dot.tip-r .dot-tip { left: auto; right: -4px; transform: none; }
.dot.tip-l .dot-tip { left: -4px; transform: none; }
.dot:hover .dot-tip, .dot:focus-visible .dot-tip { display: block; }
.strip-mark { position: absolute; left: 75%; top: -16px; bottom: -36px; border-left: 1px dashed rgba(233, 238, 248, 0.32); }
.strip-mark span { position: absolute; top: -2px; left: 5px; font-size: 11px; color: var(--text-3); white-space: nowrap; }
.strip-track { display: flex; height: 32px; border-radius: 9px; overflow: hidden; margin-top: 6px; }
.strip-track > div { flex: 1 1 0; display: grid; place-items: center; font-size: 12.5px; color: var(--text); background: rgba(255, 255, 255, 0.04); background: color-mix(in srgb, var(--band-color) 16%, transparent); border-right: 1px solid var(--surface); }
.strip-track > div:last-child { border-right: 0; }
.strip-axis { position: relative; height: 22px; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.strip-axis span { position: absolute; top: 4px; transform: translateX(-50%); }
.strip-foot { margin-top: 6px; font-size: 13px; color: var(--text-2); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0; margin-top: 16px; }
.stat { padding: 16px 20px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.stat:first-child { border-left: 0; }
.stat-label { color: var(--text-2); font-size: 13px; }
.stat-value { font-size: 28px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
.stat-value small { font-size: 14px; font-weight: 500; color: var(--text-2); margin-left: 3px; }
.stat-value .sep { color: var(--text-3); font-weight: 400; margin: 0 6px; }
.stat-note { color: var(--text-3); font-size: 12.5px; }

.rank { list-style: none; margin: 0; padding: 0; }
.rank li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto 32px; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(34, 49, 79, 0.65); }
.rank li:last-child { border-bottom: 0; }
.rank-n { width: 24px; height: 24px; border-radius: 7px; background: var(--surface-3); display: grid; place-items: center; font-size: 12.5px; font-weight: 650; color: var(--text-2); }
.rank-main { min-width: 0; }
.rank-main a { color: var(--text); text-decoration: none; font-weight: 600; }
.rank-main a:hover { color: var(--accent); }
.rank-main .nm { color: var(--text-2); font-weight: 400; margin-left: 6px; }
.rank-bar { height: 4px; background: var(--surface-3); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.rank-bar i { display: block; height: 100%; background: var(--band-color); border-radius: 2px; }
.rank .chg { font-size: 13.5px; }

/* ---------- 個股 ---------- */
.stock-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 2px 0 14px; }
.stock-id h1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.stock-id h1 .code { font-variant-numeric: tabular-nums; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.stock-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.quote { display: flex; align-items: center; gap: 16px 28px; flex-wrap: wrap; padding: 16px 20px; }
.quote-main { flex: 1 1 320px; min-width: 0; display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
.price { font-size: 36px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; }
.quote-chg { font-size: 16px; font-weight: 600; }
.quote-date { color: var(--text-2); font-size: 13px; flex-basis: 100%; }
.quote-stats { flex: 0 1 auto; display: grid; grid-template-columns: repeat(6, auto); gap: 4px 24px; margin: 0; }
.quote-stats div { display: flex; flex-direction: column; }
.quote-stats dt { color: var(--text-3); font-size: 12.5px; }
.quote-stats dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 550; }
.stock-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; margin-top: 16px; align-items: start; }
.side > .card + .card { margin-top: 16px; }
.chart-card { padding-bottom: 14px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 10px; }
.ma-row { display: flex; gap: 6px; flex-wrap: wrap; }
.ma-chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--text-2); cursor: pointer; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ma-chip .sw { width: 16px; height: 0; border-top: 2px solid var(--c); }
.ma-chip .sw.dash { border-top-style: dashed; }
.ma-chip b { font-weight: 650; color: var(--text); }
.ma-chip[aria-pressed="false"] { opacity: 0.55; }
.ma-chip[aria-pressed="false"] .sw { border-top-color: var(--text-3); }
.ma-chip[aria-pressed="false"] .state::before { content: "已隱藏"; }
.ma-chip[aria-pressed="true"] { border-color: #3f5a92; border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.ma-chip .state { font-size: 11.5px; color: var(--text-3); }
.chart-note { font-size: 13px; color: var(--warn); margin: 0 0 8px; }
.chart-box { position: relative; width: 100%; }
.chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: crosshair; border-radius: 6px; }
.price-box { height: 400px; }
.rsi-box { height: 128px; }
.macd-box { height: 146px; }
.cmp-box { height: 360px; }
.chart-tip { position: absolute; z-index: 3; pointer-events: none; min-width: 170px; padding: 8px 11px; background: rgba(14, 22, 40, 0.97); border: 1px solid var(--line-strong); border-radius: 9px; box-shadow: 0 12px 26px -10px rgba(0, 0, 0, 0.85); font-size: 12.5px; line-height: 1.55; }
.tip-date { font-weight: 650; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.tip-grid { display: grid; grid-template-columns: auto auto; gap: 0 16px; margin: 0; }
.tip-grid dt { color: var(--text-3); }
.tip-grid dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.tip-row { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.tip-row .v { margin-left: auto; padding-left: 14px; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 14px; height: 0; border-top: 2px solid var(--c); }
.legend .sw.dash { border-top-style: dashed; }
.legend .box { width: 10px; height: 10px; border-radius: 2px; border: 1.5px solid var(--c); background: var(--f, transparent); }
.legend-candle { margin: 8px 0 2px; }
.sub-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.sub-head .legend { font-variant-numeric: tabular-nums; }
.sub-head .legend b { color: var(--text); font-weight: 650; }

.score-card h2 { margin-bottom: 6px; }
.score-main { width: 100%; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: center; padding: 6px; margin: 0 -6px; border: 1px solid transparent; border-radius: 12px; background: transparent; cursor: pointer; text-align: left; width: calc(100% + 12px); }
.score-main:hover { border-color: var(--line-strong); background: var(--surface-2); }
.ring { width: 150px; height: 150px; display: block; }
.ring .num-big { font-size: 46px; font-weight: 750; fill: var(--text); font-variant-numeric: tabular-nums; }
.ring .num-sub { font-size: 13px; fill: var(--text-3); }
.score-band { font-weight: 650; color: var(--band-color); font-size: 15px; }
.score-side { display: block; min-width: 0; }
.score-parts { margin: 8px 0 0; display: grid; gap: 5px; font-size: 13px; }
.score-parts .part { display: flex; align-items: center; gap: 7px; color: var(--text-2); }
.score-parts .sw { width: 9px; height: 9px; border-radius: 2px; background: var(--c); flex: none; }
.score-parts b { margin-left: auto; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.score-hint { font-size: 12.5px; color: var(--text-3); margin-top: 8px; }
.score-hint span { color: var(--accent); }
.score-na { color: var(--text-2); font-size: 13.5px; margin-top: 6px; }
.score-hist { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.score-hist-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-3); margin-bottom: 4px; }
.score-hist svg { width: 100%; height: 54px; display: block; }

.kv { margin: 0; display: grid; gap: 9px; font-size: 13.5px; }
.kv div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; }
.nowrap { white-space: nowrap; }
.band-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.band-list li { display: grid; grid-template-columns: 72px minmax(0, 1fr) 44px; align-items: center; gap: 10px; font-size: 13.5px; }
.band-list .bl-label { color: var(--text); }
.band-list .bl-label small { display: block; color: var(--text-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.band-list .bl-bar { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.band-list .bl-bar i { display: block; height: 100%; background: var(--band-color); border-radius: 4px; }
.band-list .bl-n { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.band-list .bl-codes { grid-column: 2 / -1; margin-top: -6px; font-size: 12px; color: var(--text-3); }
.overview-grid { align-items: start; }

.ind-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.ind-grid > .card + .card { margin-top: 0; }
.ind-value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; margin: 4px 0 2px; }
.ind-state { font-size: 13.5px; font-weight: 600; }
.ind-text { font-size: 13px; color: var(--text-2); margin-top: 6px; }
.ind-rows { margin: 6px 0 0; display: grid; gap: 4px; font-size: 13.5px; }
.ind-rows div { display: flex; justify-content: space-between; gap: 10px; }
.ind-rows dt { color: var(--text-3); }
.ind-rows dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 550; }
.zone-bar { position: relative; height: 6px; border-radius: 3px; margin: 10px 0 4px; background: linear-gradient(90deg, rgba(47,195,140,.35) 0 30%, rgba(169,182,205,.28) 30% 70%, rgba(255,91,97,.35) 70% 100%); }
.zone-bar i { position: absolute; top: -4px; width: 3px; height: 14px; border-radius: 2px; background: var(--text); transform: translateX(-50%); }
.zone-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); }

.sig-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: 14px; }
.sig-list li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.sig-tag { font-size: 12px; padding: 1px 0; border-radius: 6px; text-align: center; border: 1px solid; font-weight: 600; }
.sig-tag.up { color: var(--up); border-color: rgba(255, 91, 97, 0.4); }
.sig-tag.down { color: var(--down); border-color: rgba(47, 195, 140, 0.4); }
.sig-tag.neutral { color: var(--text-2); border-color: var(--line-strong); }
.sig-tag.warn { color: var(--warn); border-color: rgba(243, 185, 77, 0.45); }
.risk-list { margin: 0; padding-left: 18px; display: grid; gap: 7px; font-size: 14px; color: var(--text-2); }
.risk-list strong { color: var(--text); font-weight: 600; }

/* ---------- 智慧選股 ---------- */
.screener { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
.screener > .card + .card { margin-top: 0; }
.filters summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.filters summary::-webkit-details-marker { display: none; }
.filters summary .chev { color: var(--text-3); font-size: 12.5px; }
.filters[open] summary { margin-bottom: 12px; }
.field { margin: 0 0 14px; border: 0; padding: 0; min-width: 0; }
.field > label:not(.check), .field legend, .field-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; padding: 0; }
.input { width: 100%; height: 38px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); outline: none; font-variant-numeric: tabular-nums; }
.input::placeholder { color: var(--text-3); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.range-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 10px; align-items: center; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
.pair label { font-size: 12.5px; color: var(--text-3); display: grid; gap: 4px; }
.pair > span { padding-bottom: 9px; color: var(--text-3); }
.checks { display: grid; gap: 4px; }
.check { display: flex; align-items: center; gap: 9px; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.check:hover { background: var(--surface-2); }
.check input { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
.presets { display: grid; gap: 6px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.presets .btn { justify-content: flex-start; height: auto; min-height: 34px; padding: 7px 10px; white-space: normal; text-align: left; line-height: 1.35; }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.form-error { color: #ffb3b6; font-size: 13px; margin-bottom: 10px; }
.dirty-note { color: var(--warn); font-size: 12.5px; margin-top: 10px; }
.res-count { color: var(--text-2); font-size: 13.5px; }
.res-count strong { color: var(--text); font-variant-numeric: tabular-nums; }
.applied { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.applied .badge { color: var(--text); }
.sort-row { display: none; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; color: var(--text-2); }

/* ---------- 比較 ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--text-2); cursor: pointer; font-size: 13.5px; }
.chip:hover { color: var(--text); border-color: #3f5a92; }
.chip b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--surface-3); color: var(--text); border-color: var(--c, var(--accent)); }
.chip .mk { width: 18px; height: 10px; flex: none; }
.inline-msg { margin-top: 10px; font-size: 13px; color: var(--warn); min-height: 1em; }
.inline-msg:empty { display: none; }
.cmp-table th[scope="row"] { color: var(--text-2); font-weight: 500; font-size: 13.5px; }
.cmp-table thead th { color: var(--text); font-size: 14px; font-weight: 650; }
.cmp-table thead th .mk { vertical-align: middle; margin-right: 6px; }
.cmp-table td { font-variant-numeric: tabular-nums; }
.best { font-size: 11px; color: var(--accent); border: 1px solid rgba(60, 200, 234, 0.4); border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }

/* ---------- 匯入 ---------- */
.drop { border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 22px 16px; text-align: center; background: var(--bg); transition: border-color 0.12s, background 0.12s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop p { color: var(--text-2); font-size: 13.5px; margin-top: 8px; }
.file-info { font-size: 13px; color: var(--text-2); margin-top: 10px; }
.file-info strong { color: var(--text); }
.form-row { display: grid; grid-template-columns: 1fr 1fr 120px; gap: 10px; }
.form-row .field { margin-bottom: 12px; }
.err-list { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
.result { margin-top: 14px; }
.result .notice + .notice { margin-top: 8px; }
.result-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
pre.code { margin: 8px 0 0; padding: 10px 12px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-x: auto; color: #cfe3f7; }
.rules { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; color: var(--text-2); }
.sample-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.sample-row small { display: block; color: var(--text-3); font-size: 12.5px; }

/* ---------- 說明 ---------- */
.doc { max-width: 920px; }
.doc .card h2 { margin-bottom: 10px; }
.doc p, .doc li { color: var(--text-2); font-size: 14.5px; }
.doc p + p { margin-top: 8px; }
.doc ul, .doc ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 5px; }
.doc strong { color: var(--text); font-weight: 600; }
.formula { display: block; margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; color: var(--text); font-size: 14px; }
.doc .table td { white-space: normal; }
.doc h3 { margin: 16px 0 4px; color: var(--text); }

/* ---------- 對話框與提示 ---------- */
.modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(3, 7, 16, 0.72); }
.modal[hidden] { display: none; }
.modal-box { width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px; box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.9); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-body { padding: 16px 20px 20px; }
.bd-total { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.bd-total .big { font-size: 34px; font-weight: 750; color: var(--band-color); font-variant-numeric: tabular-nums; }
.bd-table td { white-space: normal; font-size: 13.5px; }
.bd-table .grp td { background: var(--surface-2); font-weight: 650; color: var(--text); font-size: 13.5px; }
.bd-table .grp td .num { float: right; }
.pass { color: var(--accent); font-weight: 600; white-space: nowrap; }
.fail { color: var(--text-3); white-space: nowrap; }
.bd-note { margin-top: 12px; font-size: 13px; color: var(--text-3); }
.tiers { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.tiers span { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text-3); white-space: nowrap; }
.tiers span.on { color: var(--accent-ink); background: var(--accent); border-color: transparent; font-weight: 650; }

.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { pointer-events: auto; max-width: min(380px, calc(100vw - 32px)); background: var(--surface-3); border: 1px solid var(--line-strong); color: var(--text); padding: 10px 14px; border-radius: 10px; box-shadow: 0 16px 36px -14px rgba(0, 0, 0, 0.9); font-size: 14px; transition: opacity 0.25s, transform 0.25s; }
.toast a { margin-left: 8px; }
.toast.warn { border-color: rgba(243, 185, 77, 0.5); }
.toast.out { opacity: 0; transform: translateY(6px); }

footer { border-top: 1px solid var(--line); color: var(--text-3); font-size: 12.5px; }
footer .wrap { padding-top: 18px; padding-bottom: 28px; display: grid; gap: 4px; }

/* ---------- 響應式 ---------- */
@media (max-width: 1200px) {
  .quote-stats { grid-template-columns: repeat(3, auto); margin-left: 0; }
  .ind-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1080px) {
  .topbar-inner { height: auto; padding: 10px 16px 0; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "brand search" "nav nav"; gap: 8px 14px; }
  .brand { grid-area: brand; }
  .search { grid-area: search; width: 100%; max-width: 360px; justify-self: end; }
  .mainnav { grid-area: nav; margin: 0 -6px; padding: 0 30px 8px 0; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 30px), transparent); }
  .stock-grid { grid-template-columns: minmax(0, 1fr); }
  .side { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .side > .card + .card { margin-top: 0; }
  .screener { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .wrap { padding-left: 16px; padding-right: 16px; }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat { border-left: 0; border-top: 1px solid var(--line); padding: 14px 16px; }
  .stat:nth-child(-n + 2) { border-top: 0; }
  .stat:nth-child(even) { border-left: 1px solid var(--line); }
  .side { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 16px; }
  .quote { gap: 14px; }
  .quote-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 16px; width: 100%; }
  .price-box { height: 320px; }
  .rsi-box { height: 112px; }
  .macd-box { height: 124px; }
  .cmp-box { height: 280px; }
  .form-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .form-row .field:last-child { grid-column: 1 / -1; }
  .sort-row { display: flex; }
  .search input, .input, .select { font-size: 16px; }
  .strip { padding: 4px 18px 0; }
  .demo-banner .wrap { font-size: 12.5px; }
}
@media (max-width: 560px) {
  h1 { font-size: 22px; }
  .price { font-size: 30px; }
  .ind-grid { grid-template-columns: minmax(0, 1fr); }
  .search { max-width: none; }
  .brand span { display: none; }
  .stock-actions { width: 100%; }
  .stock-actions .select { flex: 1 1 100%; }
  .stock-actions .btn { flex: 1 1 auto; }
  .score-main { grid-template-columns: 120px minmax(0, 1fr); }
  .ring { width: 120px; height: 120px; }
  .kv div { grid-template-columns: 84px minmax(0, 1fr); }
  .rank li { grid-template-columns: 24px minmax(0, 1fr) auto 32px; }
  .rank li .chg { display: none; }
  .sample-row { grid-template-columns: minmax(0, 1fr) auto; }
  .sample-row .btn:last-child { grid-column: 2; }
  .toasts { left: 16px; right: 16px; justify-items: stretch; }
  .banner-long { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

.banner-short { display: none; }
@media (max-width: 560px) { .banner-short { display: inline; } }

</style>
</head>

<header class="topbar">

      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="14" cy="14" r="10" fill="none" stroke="#3cc8ea" stroke-width="2.3"/>
        <path d="M21.6 21.6 28 28" stroke="#3cc8ea" stroke-width="3" stroke-linecap="round"/>
        <path d="M9.6 9.8v10.4M14 7.6v10.8M18.4 9.4v8.2" stroke-width="1.1" stroke-linecap="round" stroke="#7f8ea9"/>
        <rect x="8.3" y="12.2" width="2.6" height="5.6" rx=".6" fill="#2fc38c"/>
        <rect x="12.7" y="9.6" width="2.6" height="6.8" rx=".6" fill="#ff5b61"/>

<script>

  function generateSeries(def, days) {
    const rand = mulberry32(def.seed);

      rows.push({ date: days[i], open, high, low, close, volume });

  function sma(values, n) {

    let s = 0;
    for (let i = start; i < start + n; i++) s += values[i];

        const mx = Math.max(num.Open, num.Close, num.Low);
        const mn = Math.min(num.Open, num.Close);
        if (num.High < mx) errs.push(`High ${num.High} 必須 ≥ max(Open, Close, Low) = ${mx}`);
        if (num.Low > mn) errs.push(`Low ${num.Low} 必須 ≤ min(Open, Close) = ${mn}`);

      if (dateOk) rows.push({ date: ds, open: num.Open, high: num.High, low: num.Low, close: num.Close, volume: num.Volume });

  /* ---------- K 線＋成交量 ---------- */
  class PriceChart {
    constructor(canvas, tip, group, opts) {

      if (!st || st.rows.length < 2) {

  /* ---------- RSI ---------- */

      });

        polyline(ctx, vals, s, e, X, Y, COLORS.rsi, [], 1.6);
      }
      if (hv0 != null && hv0 >= s && hv0 <= e) crosshairX(ctx, X(hv0), T, B);

    }
  }

  /* ---------- MACD ---------- */
  class MACDChart {
    constructor(canvas, group) {
      this.canvas = canvas; this.group = group; this.pointer = null;
      group.charts.push(this);
      bindPointer(this);
    }
    setData(stock) { this.stock = stock; }
    indexAtX(x) { return indexAt(this, x); }
    draw() {
      const { ctx, w, h } = setup(this.canvas);
      const st = this.stock, g = this.group;
      if (!st || st.rows.length < 2) { this.geo = null; emptyMsg(ctx, w, h, '資料不足'); return; }
      const { L, R, T, B, bw, X } = baseGeom(this, w, h, 8);
      const s = g.start, e = g.end, ind = st.ind;
      let m = 0;
      for (let i = s; i <= e; i++) for (const k of ['macd', 'signal', 'hist']) { const v = ind[k][i]; if (v != null) m = Math.max(m, Math.abs(v)); }
      const has = m > 0 || rangeHas(ind.macd, s, e);
      if (m === 0) m = 1;
      const lo = -m * 1.15, hi = m * 1.15;

      const tk = niceTicks(lo, hi, 4);
      ctx.lineWidth = 1;
      tk.list.forEach((v) => {

  }

  /* ---------- 多線走勢（股票比較） ---------- */
  class LineChart {
    constructor(canvas, tip, opts) {

      this.group.charts.push(this);

      this.dates = dates; this.series = series;

    }
    draw() {
      const { ctx, w, h } = setup(this.canvas);
      const g = this.group;
      if (!this.dates || this.dates.length < 2 || !this.series.length) {
        this.geo = null;
        emptyMsg(ctx, w, h, '共同交易日不足，無法繪製走勢');
        if (this.tip) this.tip.hidden = true;
        return;
      }
      let lo = Infinity, hi = -Infinity;
      this.series.forEach((sr) => sr.values.forEach((v) => { if (v < lo) lo = v; if (v > hi) hi = v; }));
      if (this.base != null) { lo = Math.min(lo, this.base); hi = Math.max(hi, this.base); }
      const span = hi - lo || 1;
      lo -= span * 0.08; hi += span * 0.1;
      const tk = niceTicks(lo, hi, 5);
      const labels = tk.list.map((v) => fmt(v, tk.dec));
      g.axisW = Math.max(48, Math.ceil(Math.max(...labels.map((l) => ctx.measureText(l).width))) + 20);
      const { L, R, T, B, bw, X } = baseGeom(this, w, h, 22);
      // 讓首尾點落在邊界
      const n = this.dates.length;
      const XX = n > 1 ? (i) => L + (i / (n - 1)) * (R - L) : X;
      const Y = (v) => T + ((hi - v) / (hi - lo)) * (B - T);
      this.geo = { L, R, T, B, bw: (R - L) / Math.max(1, n - 1), X: XX, Y };
      ctx.lineWidth = 1;
      tk.list.forEach((v, k) => {
        const y = Math.round(Y(v)) + 0.5;
        if (y < T || y > B) return;
        ctx.strokeStyle = COLORS.grid; line(ctx, L, y, R, y);
        ctx.fillStyle = COLORS.axis; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
        ctx.fillText(labels[k], R + 8, y);
      });
      if (this.base != null) {
        const y = Math.round(Y(this.base)) + 0.5;
        ctx.save(); ctx.strokeStyle = 'rgba(233,238,248,0.35)'; ctx.setLineDash([2, 3]); line(ctx, L, y, R, y); ctx.restore();
      }
      this.series.forEach((sr) => {
        polyline(ctx, sr.values, 0, n - 1, XX, Y, sr.color, sr.dash, 2);
        drawMarker(ctx, sr.marker, XX(n - 1), Y(sr.values[n - 1]), sr.color);
      });
      drawDates(ctx, this.dates, 0, n - 1, XX, B + 6, L, R);
      const hv = g.hover;
      if (hv != null) {
        const x = XX(hv);
        crosshairX(ctx, x, T, B);
        this.series.forEach((sr) => drawMarker(ctx, sr.marker, x, Y(sr.values[hv]), sr.color));
        tag(ctx, x, B + 12, this.dates[hv], COLORS.tag, COLORS.tagText, 'center');
        placeTip(this, x);
      } else if (this.tip) this.tip.hidden = true;
    }
  }
  // 比較圖的索引需對應首尾貼齊的座標
  LineChart.prototype.indexAtX = function (x) {
    const geo = this.geo;
    if (!geo || !this.dates) return null;
    const n = this.dates.length;
    const i = Math.round(((x - geo.L) / (geo.R - geo.L)) * (n - 1));
    return Math.max(0, Math.min(n - 1, i));
  };

  function drawMarker(ctx, kind, x, y, color) {
    ctx.save();
    ctx.fillStyle = color; ctx.strokeStyle = '#0a1020'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (kind === 'square') ctx.rect(x - 4.5, y - 4.5, 9, 9);

  function parseRoute() {
    let h = location.hash.replace(/^#\/?/, '');
    try { h = decodeURIComponent(h); } catch (e) { /* 保留原字串 */ }
    const parts = h.split('/');
    return { view: VIEWS.includes(parts[0]) ? parts[0] : 'overview', param: parts.slice(1).join('/') || null };
  }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
  function observe(el, fn) {
    if (!el) return;
    let raf = 0;
    const run = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(fn); };
    if ('ResizeObserver' in window) {
      const ro = new ResizeObserver(run);
      ro.observe(el);
      state.observers.push(() => ro.disconnect());
    } else {
      window.addEventListener('resize', run);
      state.observers.push(() => window.removeEventListener('resize', run));
    }
  }
  function disposeObservers() { state.observers.forEach((f) => f()); state.observers = []; }
  function render() {
    const r = parseRoute();
    const changed = r.view !== state.route.view || r.param !== state.route.param;
    state.route = r;
    disposeObservers();
    closeSearch();
    closeModal();
    state.chart = null;
    VIEWS.forEach((v) => { $('#view-' + v).hidden = v !== r.view; });
    $$('.mainnav a').forEach((a) => {
      const on = a.dataset.route === r.view;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.title = `${TITLES[r.view]}｜StockLens 智慧選股分析平台`;
    ({ overview: renderOverview, stock: renderStock, screener: renderScreener, compare: renderCompare, watchlist: renderWatchlist, import: renderImport, about: renderAbout })[r.view](r.param);
    if (changed) window.scrollTo(0, 0);
  }
  function updateBanner() { $('#demoBanner').hidden = !allStocks().some((s) => s.source === 'demo'); }
  function updateWatchCount() { $('#watchCount').textContent = state.watch.length ? String(state.watch.length) : ''; }
  function updateNavStock() { $('#navStock').setAttribute('href', '#/stock/' + enc(state.current)); }

  function bandRows(scored, unscored) {
    const maxN = Math.max(1, scored.length + unscored.length);
    const ranges = { strong: '80～100 分', bull: '60～79 分', neutral: '40～59 分', weak: '20～39 分', bear: '0～19 分' };
    const rows = C.BANDS.map((b) => {
      const items = scored.filter((s) => s.score.band.key === b.key);
      return `<li data-band="${b.key}"><span class="bl-label">${b.label.replace('技術面', '')}<small>${ranges[b.key]}</small></span>
        <span class="bl-bar" aria-hidden="true"><i style="width:${(items.length / maxN) * 100}%"></i></span><span class="bl-n">${items.length} 檔</span>
        <span class="bl-codes">${items.length ? items.map((s) => `${esc(s.code)} ${esc(s.name)}`).join('、') : '無'}</span></li>`;
    });
    if (unscored.length) rows.push(`<li data-band="na"><span class="bl-label">無法評分<small>資料不足</small></span><span class="bl-bar" aria-hidden="true"><i style="width:${(unscored.length / maxN) * 100}%"></i></span><span class="bl-n">${unscored.length} 檔</span><span class="bl-codes">${unscored.map((s) => `${esc(s.code)} ${esc(s.name)}`).join('、')}</span></li>`);
    return rows.join('');

  function rankItem(s, i) {

  }
  let stripWidth = 0;
  function layoutStrip() {
    const box = $('#scoreStrip');
    if (!box) return;
    const W = box.clientWidth;
    if (!W || W === stripWidth) return;
    stripWidth = W;
    const list = allStocks().filter((s) => s.score.ok)
      .sort((a, b) => a.score.total - b.score.total || a.code.localeCompare(b.code, 'en', { numeric: true }));
    const rowEnd = [];
    const placed = list.map((s) => {
      const x = (s.score.total / 100) * W;
      const half = Math.max(15, s.code.length * 4.3 + 5);
      let row = 0;
      while (rowEnd[row] != null && rowEnd[row] > x - half - 3) row++;
      rowEnd[row] = x + half;
      return { s, row };
    });
    const nRows = Math.max(1, rowEnd.length);
    const bands = [['bear', '弱勢'], ['weak', '偏弱'], ['neutral', '中性'], ['bull', '偏多'], ['strong', '強勢']];
    box.innerHTML = `
      <div class="strip-dots" style="height:${nRows * 34}px">
        <div class="strip-mark"><span>75 分</span></div>
        ${placed.map(({ s, row }) => `<a class="dot${s.score.total >= 65 ? ' tip-r' : s.score.total <= 35 ? ' tip-l' : ''}" href="#/stock/${enc(s.code)}" data-band="${s.score.band.key}" style="left:${s.score.total}%;bottom:${row * 34}px">

  }

  function ringSVG(sc) {
    const R = 80, CIRC = 2 * Math.PI * R, gap = CIRC * 0.014, avail = CIRC - gap * PARTS.length;
    let pos = 0, segs = '';
    PARTS.forEach((p) => {
      const len = (avail * p.max) / 100;
      const common = `cx="100" cy="100" r="${R}" fill="none" stroke-width="15" transform="rotate(-90 100 100)" stroke-dashoffset="${(-pos).toFixed(2)}"`;
      segs += `<circle ${common} style="stroke:rgba(130,150,190,.17)" stroke-dasharray="${len.toFixed(2)} ${CIRC.toFixed(2)}"/>`;
      if (sc.ok && sc.groups[p.key] > 0) segs += `<circle ${common} style="stroke:${p.color}" stroke-dasharray="${((len * sc.groups[p.key]) / p.max).toFixed(2)} ${CIRC.toFixed(2)}"/>`;
      pos += len + gap;
    });
    const center = sc.ok
      ? `<text x="100" y="106" text-anchor="middle" class="num-big">${sc.total}</text><text x="100" y="134" text-anchor="middle" class="num-sub">/ 100 分</text>`
      : '<text x="100" y="116" text-anchor="middle" class="num-big" style="fill:var(--text-3)">—</text>';
    return `<svg class="ring" viewBox="0 0 200 200" aria-hidden="true">${segs}${center}</svg>`;
  }
  function scoreCardHTML(st) {
    const sc = st.score;
    const label = sc.ok ? `綜合評分 ${sc.total} 分，${sc.band.label}。查看各項得分與理由` : '資料不足，無法評分。查看原因';
    return `<section class="card score-card" aria-labelledby="scoreTitle">
      <h2 id="scoreTitle">綜合評分</h2>
      <button class="score-main" type="button" data-action="score-detail" data-code="${esc(st.code)}" aria-haspopup="dialog" aria-label="${label}">
        ${ringSVG(sc)}
        <span class="score-side" data-band="${sc.ok ? sc.band.key : 'na'}">
          <span class="score-band">${sc.ok ? sc.band.label : '資料不足，無法評分'}</span>
          ${sc.ok
            ? `<span class="score-parts">${PARTS.map((p) => `<span class="part"><i class="sw" style="--c:${p.color}"></i>${p.label}<b>${sc.groups[p.key]} / ${p.max}</b></span>`).join('')}</span>`
            : `<span class="score-na">需要至少 ${C.SCORE_MIN_DAYS} 個交易日資料才能計算 MA60 與評分，目前只有 ${st.snap.days} 個交易日。</span>`}
        </span>
      </button>
      <p class="score-hint">點擊評分卡可查看<span>各項得分與理由</span>。綜合評分不是上漲機率。</p>
      ${scoreHistHTML(st)}
    </section>`;
  }
  function scoreHistHTML(st) {
    const h = st.scoreHistory;
    if (!h || h.length < 2) return '';
    const W = 300, H = 54, n = h.length;
    const X = (i) => (i / (n - 1)) * W, Y = (v) => H - 4 - (v / 100) * (H - 8);
    const pts = h.map((p, i) => `${X(i).toFixed(1)},${Y(p.total).toFixed(1)}`).join(' ');
    const vals = h.map((p) => p.total), mn = Math.min(...vals), mx = Math.max(...vals);
    return `<div class="score-hist">
      <div class="score-hist-head"><span>近 ${n} 個交易日評分</span><span>最低 ${mn}，最高 ${mx}</span></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="近 ${n} 個交易日綜合評分走勢，最低 ${mn} 分，最高 ${mx} 分，最新 ${vals[n - 1]} 分；虛線為 75 分">
        <line x1="0" x2="${W}" y1="${Y(75).toFixed(1)}" y2="${Y(75).toFixed(1)}" style="stroke:rgba(233,238,248,.28)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
        <polyline points="${pts}" fill="none" style="stroke:var(--accent)" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      </svg></div>`;
  }
  function statusHTML(st) {
    const d = C.daysBetweenISO(st.snap.date, todayISO());
    const age = d < 0 ? '最新資料日期晚於今天，請確認檔案中的日期。' : `最新資料日期距今 ${d} 天。`;
    const delay = st.source === 'demo' ? `示範資料隨網頁版本提供，不會自動更新；${age}` : `依匯入檔案內容，不會自動更新；${age}`;
    return `<section class="card status-card" aria-labelledby="statusTitle">
      <h2 id="statusTitle" style="margin-bottom:10px">資料狀態</h2>
      <dl class="kv">
        <div><dt>資料來源</dt><dd>${SOURCE[st.source].label}${st.fileName ? `（${esc(st.fileName)}）` : ''}</dd></div>
        <div><dt>示範資料</dt><dd>${st.source === 'demo' ? '是：示範資料，非真實行情' : '否'}</dd></div>
        <div><dt>最新資料日期</dt><dd class="tabular">${st.snap.date}</dd></div>
        <div><dt>資料期間</dt><dd class="tabular"><span class="nowrap">${st.snap.firstDate} ～ ${st.snap.date}</span><br>共 ${st.snap.days} 個交易日</dd></div>
        <div><dt>資料延遲</dt><dd>${delay}</dd></div>
        ${st.source === 'csv' ? '<div><dt>價格調整</dt><dd>假設已採一致調整口徑，未處理除權息與股票分割</dd></div>' : ''}
      </dl>
    </section>`;
  }
  function rsiCard(st) {
    const v = st.snap.rsi;
    let state1 = '需至少 15 個交易日資料', tone = 'muted';
    if (isNum(v)) {
      if (v > 70) { state1 = 'RSI > 70：動能較強，也可能過熱'; tone = 'up'; }
      else if (v < 30) { state1 = 'RSI < 30：動能偏弱，也可能超賣'; tone = 'down'; }
      else { state1 = '30～70：一般觀察區間'; tone = ''; }
    }
    return `<section class="card" aria-labelledby="rsiCardT">
      <h2 id="rsiCardT">RSI(14)</h2>
      <p class="ind-value">${fNum(v)}</p>
      <p class="ind-state ${tone}">${state1}</p>
      ${isNum(v) ? `<div class="zone-bar" aria-hidden="true"><i style="left:${Math.max(0, Math.min(100, v))}%"></i></div>
      <div class="zone-scale" aria-hidden="true"><span>0</span><span>超賣 30</span><span>70 過熱</span><span>100</span></div>` : ''}
      <p class="ind-text">採 Wilder 平滑法。RSI 不是單獨的買賣保證訊號。</p>
    </section>`;
  }
  function macdCard(st) {
    const sn = st.snap, i = st.rows.length - 1, hp = st.ind.hist[i - 1];
    let s1 = 'MACD 需至少 34 個交易日資料', s2 = '';
    if (isNum(sn.macd) && isNum(sn.signal)) {
      s1 = sn.macd > sn.signal ? 'MACD 在訊號線之上' : 'MACD 在訊號線之下';
      if (isNum(sn.hist) && isNum(hp)) s2 = sn.hist > 0 ? (sn.hist > hp ? '柱狀體為正，且較前一日擴大。' : '柱狀體為正，但較前一日縮小。') : (sn.hist < hp ? '柱狀體為負，且較前一日擴大。' : '柱狀體為負，但較前一日收斂。');
    }
    return `<section class="card" aria-labelledby="macdCardT">
      <h2 id="macdCardT">MACD(12, 26, 9)</h2>
      <dl class="ind-rows">
        <div><dt>MACD（EMA12 − EMA26）</dt><dd>${fSig(sn.macd)}</dd></div>
        <div><dt>訊號線（EMA9）</dt><dd>${fSig(sn.signal)}</dd></div>
        <div><dt>柱狀體</dt><dd class="${dirOf(sn.hist)}">${fSig(sn.hist)}</dd></div>
      </dl>
      <p class="ind-state" style="margin-top:8px">${s1}</p>
      <p class="ind-text">${s2 || '比較 MACD 與訊號線的相對位置，以及柱狀體的正負與變化。'}</p>
    </section>`;
  }
  function volCard(st) {
    const sn = st.snap, vr = sn.vratio;
    let s = '需至少 20 個交易日資料';
    if (isNum(vr)) s = vr >= 2 ? '明顯放量（量比 ≥ 2）' : vr >= 1.2 ? '放量（量比 ≥ 1.2）' : vr >= 0.8 ? '接近均量' : '量縮（量比 < 0.8）';
    return `<section class="card" aria-labelledby="volCardT">
      <h2 id="volCardT">成交量</h2>
      <dl class="ind-rows">
        <div><dt>最新成交量</dt><dd>${fVol(st, sn.volume)}</dd></div>
        <div><dt>20 日平均成交量</dt><dd>${fVol(st, sn.vma20)}</dd></div>
        <div><dt>量比</dt><dd>${fNum(vr)}</dd></div>
      </dl>
      <p class="ind-state" style="margin-top:8px">${s}</p>
      <p class="ind-text">量比 = 最新成交量 ÷ 20 日平均成交量${st.volumeUnit === 'shares' ? '；1 張 = 1,000 股' : ''}。</p>
    </section>`;
  }
  function retCard(st) {
    const sn = st.snap;
    const row = (n, v) => `<div><dt>${n} 個交易日</dt><dd>${isNum(v) ? chg(v) : `<span class="muted" title="資料少於 ${n + 1} 個交易日">N/A</span>`}</dd></div>`;
    return `<section class="card" aria-labelledby="retCardT">
      <h2 id="retCardT">近期報酬率</h2>
      <dl class="ind-rows">${row(5, sn.ret5)}${row(20, sn.ret20)}${row(60, sn.ret60)}</dl>
      <p class="ind-text">報酬率 = (目前收盤價 ÷ N 個交易日前收盤價 − 1) × 100%；資料不足顯示 N/A，不以 0 代替。</p>
    </section>`;
  }
  function recentCross(a, b, i, look) {
    for (let k = 0; k < look; k++) {
      const j = i - k;
      if (j < 1 || [a[j], b[j], a[j - 1], b[j - 1]].some((v) => v == null)) break;
      const d1 = a[j] - b[j], d0 = a[j - 1] - b[j - 1];
      if (d0 <= 0 && d1 > 0) return { dir: 1, ago: k };
      if (d0 >= 0 && d1 < 0) return { dir: -1, ago: k };
    }
    return null;
  }
  const agoText = (k) => (k === 0 ? '今日' : `${k} 個交易日前`);
  function signals(st) {
    const sn = st.snap, ind = st.ind, i = st.rows.length - 1, out = [];
    const push = (tone, text) => out.push({ tone, text });
    if (isNum(sn.ma20)) push(sn.close > sn.ma20 ? 'up' : 'down', sn.close > sn.ma20
      ? `收盤價 ${fPrice(sn.close)} 高於 MA20（${fPrice(sn.ma20)}），中期價格位置偏強。`
      : `收盤價 ${fPrice(sn.close)} 未高於 MA20（${fPrice(sn.ma20)}），中期價格位置偏弱。`);
    if (isNum(sn.ma20) && isNum(sn.ma60)) {
      if (sn.close > sn.ma20 && sn.ma20 > sn.ma60) push('up', '收盤價 > MA20 > MA60，可視為偏多趨勢的參考訊號，但不保證價格持續上漲。');
      else push(sn.ma20 > sn.ma60 ? 'up' : 'down', sn.ma20 > sn.ma60 ? 'MA20 高於 MA60，中長期均線結構偏多。' : 'MA20 低於 MA60，中長期均線結構偏空。');
    }
    const cross = recentCross(ind.ma5, ind.ma20, i, 5);
    if (cross) push(cross.dir > 0 ? 'up' : 'down', cross.dir > 0 ? `${agoText(cross.ago)} MA5 向上穿越 MA20（短線黃金交叉）。` : `${agoText(cross.ago)} MA5 向下跌破 MA20（短線死亡交叉）。`);
    if (isNum(sn.rsi)) {
      if (sn.rsi > 70) push('warn', `RSI ${fNum(sn.rsi)} 高於 70，動能較強，但也可能過熱。`);
      else if (sn.rsi < 30) push('warn', `RSI ${fNum(sn.rsi)} 低於 30，動能偏弱，也可能處於超賣。`);
      else push('neutral', `RSI ${fNum(sn.rsi)} 位於 30～70 一般觀察區間，動能${sn.rsi >= 50 ? '中性偏強' : '中性偏弱'}。`);
    }
    if (isNum(sn.macd) && isNum(sn.signal)) {
      const above = sn.macd > sn.signal;
      let t = above ? 'MACD 位於訊號線之上' : 'MACD 位於訊號線之下';
      const mc = recentCross(ind.macd, ind.signal, i, 5);
      if (mc) t += mc.dir > 0 ? `，${agoText(mc.ago)}出現黃金交叉` : `，${agoText(mc.ago)}出現死亡交叉`;
      const hp = ind.hist[i - 1];
      if (isNum(sn.hist) && isNum(hp)) t += sn.hist > 0 ? (sn.hist > hp ? '；柱狀體為正且擴大' : '；柱狀體為正但縮小') : (sn.hist < hp ? '；柱狀體為負且擴大' : '；柱狀體為負但收斂');
      push(above ? 'up' : 'down', t + '。');
    }
    if (isNum(sn.vratio) && isNum(sn.changePct)) {
      const d = dirOf(sn.changePct);
      if (sn.vratio >= 1.2) push(d === 'up' ? 'up' : d === 'down' ? 'down' : 'neutral', `量比 ${fNum(sn.vratio)}，${d === 'up' ? '放量上漲，量價配合' : d === 'down' ? '放量下跌，留意賣壓' : '放量但收平盤'}。`);
      else if (sn.vratio < 0.8) push('neutral', `量比 ${fNum(sn.vratio)}，成交量低於 20 日均量（量縮）${d === 'up' ? '，上漲力道有待確認' : ''}。`);
      else push('neutral', `量比 ${fNum(sn.vratio)}，成交量接近 20 日均量。`);
    }
    if (isNum(sn.ret20)) push(dirOf(sn.ret20) === 'up' ? 'up' : dirOf(sn.ret20) === 'down' ? 'down' : 'neutral', `近 20 個交易日報酬率 ${fPct(sn.ret20)}。`);
    return out;
  }
  function risks(st) {
    const sn = st.snap, out = [];
    out.push('<strong>綜合評分不是上漲機率</strong>，80 分不代表 80% 上漲機率。');
    out.push('技術指標以歷史價格計算，具有落後性；單一指標可能產生錯誤訊號，也無法預測未來股價。');
    if (st.source === 'demo') out.push('<strong>此股票為模擬示範資料，非真實行情</strong>，請勿作為交易依據。');
    else out.push('匯入資料的正確性取決於檔案來源；本站未處理除權息與股票分割。');
    if (isNum(sn.rsi) && sn.rsi > 70) out.push('RSI 高於 70，短線可能過熱，留意追高後回檔的風險。');
    if (isNum(sn.rsi) && sn.rsi < 30) out.push('RSI 低於 30，超賣不等於即將反彈，弱勢可能延續。');
    if (isNum(sn.vratio) && sn.vratio >= 1.5 && isNum(sn.changePct) && sn.changePct < 0) out.push('放量下跌，留意短線賣壓。');
    if (isNum(sn.ret5) && Math.abs(sn.ret5) >= 10) out.push(`近 5 個交易日變動 ${fPct(sn.ret5)}，價格波動劇烈。`);
    if (sn.days < 120) out.push(`資料期間只有 ${sn.days} 個交易日，指標穩定度較低${st.score.ok ? '' : '，且不足以計算綜合評分'}。`);
    out.push('StockLens 不提供投資建議，也不保證投資獲利。');
    return out;
  }

  function mountStockCharts(st) {
    const group = Charts.createGroup();
    const price = new Charts.PriceChart($('#cvPrice'), $('#view-stock .price-box .chart-tip'), group, { volDiv: volSpec(st).div, tipHTML: (i) => priceTip(st, i) });
    const rsi = new Charts.RSIChart($('#cvRSI'), group);
    const macd = new Charts.MACDChart($('#cvMACD'), group);
    [price, rsi, macd].forEach((c) => c.setData(st));
    price.ma = Object.assign({}, state.ma);
    group.onHover = (i) => updateLegends(st, i);
    state.chart = { group, price, st };
    applyPeriod();
    observe($('#view-stock .chart-card'), () => group.redraw());
  }
  function periodRange(st, months) {
    const rows = st.rows, last = rows[rows.length - 1].date;
    const cutoff = C.addMonthsISO(last, -months);
    let start = rows.findIndex((r) => r.date > cutoff);
    if (start < 0) start = rows.length - 1;
    return { start, end: rows.length - 1, short: rows[0].date > cutoff };
  }
  function applyPeriod() {
    if (!state.chart) return;
    const { group, st } = state.chart;
    const p = PERIODS.find((x) => x.key === state.period);
    const r = periodRange(st, p.months);
    group.start = r.start; group.end = r.end; group.hover = null; group.active = null;
    const note = $('#periodNote');
    if (st.rows.length < 2) { note.textContent = `資料不足：目前只有 ${st.rows.length} 個交易日，無法繪製 K 線圖。`; note.hidden = false; }
    else if (r.short) { note.textContent = `資料只涵蓋 ${st.rows.length} 個交易日（${st.rows[0].date} 起），少於所選的 ${p.label}，以下顯示全部可用資料。`; note.hidden = false; }
    else note.hidden = true;
    const vis = st.rows.slice(r.start, r.end + 1);
    const hi = Math.max(...vis.map((x) => x.high)), lo = Math.min(...vis.map((x) => x.low));
    $('#cvPrice').setAttribute('aria-label', `${st.code} ${st.name} ${p.label} K 線圖，${vis[0].date} 至 ${vis[vis.length - 1].date}，共 ${vis.length} 個交易日，期間最高 ${fPrice(hi)}、最低 ${fPrice(lo)}，最新收盤 ${fPrice(st.snap.close)}。可用左右方向鍵逐日查看。`);
    $$('[data-action="period"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.period === state.period)));
    group.redraw();
    updateLegends(st, null);
  }
  function updateLegends(st, i) {
    const idx = i == null ? st.rows.length - 1 : i;
    const ind = st.ind;
    [5, 20, 60].forEach((p) => {
      const el = $('#maVal' + p);
      if (el) el.textContent = isNum(ind['ma' + p][idx]) ? fPrice(ind['ma' + p][idx]) : '資料不足';
    });
    const rl = $('#rsiLegend');
    if (rl) rl.innerHTML = `<span class="tabular">${st.rows[idx].date}</span><span>RSI <b>${fNum(ind.rsi[idx])}</b></span><span><i class="sw dash" style="--c:rgba(195,141,255,.75)"></i>30／70 參考線</span>`;
    const ml = $('#macdLegend');
    if (ml) ml.innerHTML = `<span><i class="sw" style="--c:var(--ma20)"></i>MACD <b>${fSig(ind.macd[idx])}</b></span><span><i class="sw dash" style="--c:var(--ma5)"></i>訊號線 <b>${fSig(ind.signal[idx])}</b></span><span><i class="box" style="--c:var(--up);--f:var(--up)"></i><i class="box" style="--c:var(--down);--f:var(--down)"></i>柱狀體 <b>${fSig(ind.hist[idx])}</b></span>`;
  }
  function priceTip(st, i) {
    const r = st.rows[i], p = st.rows[i - 1];
    const pct = p ? (r.close / p.close - 1) * 100 : null;
    return `<div class="tip-date">${r.date}</div><dl class="tip-grid">
      <dt>開盤</dt><dd>${fPrice(r.open)}</dd><dt>最高</dt><dd>${fPrice(r.high)}</dd>
      <dt>最低</dt><dd>${fPrice(r.low)}</dd><dt>收盤</dt><dd>${fPrice(r.close)}</dd>
      <dt>漲跌幅</dt><dd>${chg(pct)}</dd><dt>成交量</dt><dd>${fVol(st, r.volume)}</dd></dl>`;
  }
  function toggleMA(p) {
    state.ma[p] = !state.ma[p];
    $$('[data-action="ma"]').filter((b) => +b.dataset.ma === p).forEach((b) => b.setAttribute('aria-pressed', String(state.ma[p])));
    if (state.chart) { state.chart.price.ma = Object.assign({}, state.ma); state.chart.group.redraw(); }
  }
  function scoreDetail(code) {
    const st = state.stocks.get(code);
    if (!st) return;
    const sc = st.score;
    if (!sc.ok) {
      openModal(`${st.code} ${st.name}｜評分細項`, `
        <div class="notice warn">資料不足，無法評分。</div>
        <p style="margin-top:12px;color:var(--text-2)">綜合評分需要 MA60 等核心指標，至少要有 ${C.SCORE_MIN_DAYS} 個交易日資料；這檔股票目前只有 ${st.snap.days} 個交易日。為避免誤導，系統不會強行給分。</p>
        <p style="margin-top:8px;color:var(--text-2)">目前無法計算：${sc.missing.map(esc).join('、')}。</p>`);
      return;
    }
    const I = sc.inputs;
    const it = {};
    sc.items.forEach((x) => { it[x.key] = x; });
    const mark = (pass) => (pass ? '<span class="pass">✓ 符合</span>' : '<span class="fail">✕ 不符合</span>');
    const row = (cond, value, status, item) => `<tr><td>${cond}</td><td>${value}</td><td>${status}</td><td class="num"><b>${item.pts}</b> / ${item.max}</td></tr>`;
    const grp = (label, key, max) => `<tr class="grp"><td colspan="4">${label}<span class="num">${sc.groups[key]} / ${max} 分</span></td></tr>`;
    const tiers = (list, on) => `<div class="tiers">${list.map(([r, p]) => `<span class="${r === on ? 'on' : ''}">${r}：${p} 分</span>`).join('')}</div>`;
    const rsiTiers = [['50 ≤ RSI ≤ 70', 25], ['40 ≤ RSI < 50', 15], ['RSI > 70', 15], ['30 ≤ RSI < 40', 5], ['RSI < 30', 0]];
    const volTiers = [['收盤上漲且量比 ≥ 1.2', 10], ['收盤上漲且 1.0 ≤ 量比 < 1.2', 6], ['其他情況', 0]];
    const move = I.up ? '上漲' : I.c < I.pc ? '下跌' : '平盤';
    openModal(`${st.code} ${st.name}｜評分細項`, `
      <div class="bd-total" data-band="${sc.band.key}"><span class="big">${sc.total}</span><span class="muted">/ 100 分</span><span class="score-band">${sc.band.label}</span></div>
      <div class="table-wrap"><table class="table bd-table">
        <thead><tr><th scope="col">評分條件</th><th scope="col">目前數值</th><th scope="col">結果</th><th scope="col" class="num">得分</th></tr></thead>
        <tbody>
          ${grp('趨勢', 'trend', 40)}
          ${row('收盤價高於 MA20', `收盤 ${fPrice(I.c)}；MA20 ${fPrice(I.ma20)}`, mark(it.close_ma20.pass), it.close_ma20)}
          ${row('MA20 高於 MA60', `MA20 ${fPrice(I.ma20)}；MA60 ${fPrice(I.ma60)}`, mark(it.ma20_ma60.pass), it.ma20_ma60)}
          ${row('當日 MA20 高於前五個交易日的 MA20', `今日 ${fPrice(I.ma20)}；5 個交易日前 ${fPrice(I.ma20p)}`, mark(it.ma20_rising.pass), it.ma20_rising)}
          ${grp('動能（RSI）', 'rsi', 25)}
          ${row('RSI(14) 分級', `RSI ${fNum(I.rsi)}${tiers(rsiTiers, it.rsi.rule)}`, `<span class="${it.rsi.pts ? 'pass' : 'fail'}">${it.rsi.rule}</span>`, it.rsi)}
          ${grp('MACD', 'macd', 25)}
          ${row('MACD 高於訊號線', `MACD ${fSig(I.macd)}；訊號線 ${fSig(I.sig)}`, mark(it.macd_signal.pass), it.macd_signal)}
          ${row('柱狀體 > 0 且較前一日增加', `今日 ${fSig(I.hist)}；前一日 ${fSig(I.histP)}`, mark(it.hist_up.pass), it.hist_up)}
          ${grp('成交量', 'volume', 10)}
          ${row('量價關係', `收盤 ${fPrice(I.c)}，前一交易日 ${fPrice(I.pc)}（${move}）；量比 ${isNum(I.vr) ? I.vr.toFixed(3) : 'N/A'}${tiers(volTiers, it.volume.rule)}`, `<span class="${it.volume.pts ? 'pass' : 'fail'}">${it.volume.rule}</span>`, it.volume)}
        </tbody>
      </table></div>
      <p class="bd-note">依 ${sc.date} 收盤資料計算，合計 ${sc.groups.trend} + ${sc.groups.rsi} + ${sc.groups.macd} + ${sc.groups.volume} = ${sc.total} 分。綜合評分並非上漲機率，80 分不等於 80% 上漲機率。${st.source === 'demo' ? '此股票為示範資料，非真實行情。' : ''}</p>`);
  }
  function compareAdd(code) {
    if (state.compare.includes(code)) { toast(`${esc(code)} 已在比較清單中<a href="#/compare">前往比較</a>`); return; }
    if (state.compare.length >= 3) { toast('最多比較三檔股票，請先到「股票比較」取消一檔<a href="#/compare">前往比較</a>', { tone: 'warn' }); return; }
    state.compare.push(code);
    toast(`已加入比較：${esc(code)}（${state.compare.length} / 3）<a href="#/compare">前往比較</a>`);
  }
  function exportCSV(code) {
    const st = state.stocks.get(code);
    if (!st) return;
    download(safeName(`${st.code}_${st.name}${st.source === 'demo' ? '_示範資料' : ''}`) + '.csv', C.toCSV(st.rows));
    toast(`已匯出 ${esc(st.code)} 的 CSV，共 ${st.rows.length} 筆`);
  }

  /* ==========================================================================
     智慧選股
     ========================================================================== */
  function applyFilters(f) {
    const q = f.q.trim().toLowerCase();
    return allStocks().filter((s) => {
      const sn = s.snap;
      if (q && !(s.code.toLowerCase().includes(q) || s.name.toLowerCase().includes(q))) return false;
      if (f.minScore > 0 && !(s.score.ok && s.score.total >= f.minScore)) return false;
      if ((f.rsiMin > 0 || f.rsiMax < 100) && !(isNum(sn.rsi) && sn.rsi >= f.rsiMin && sn.rsi <= f.rsiMax)) return false;
      if (f.aboveMA20 && !(isNum(sn.ma20) && sn.close > sn.ma20)) return false;
      if (f.ma20AboveMA60 && !(isNum(sn.ma20) && isNum(sn.ma60) && sn.ma20 > sn.ma60)) return false;
      if (f.macdAbove && !(isNum(sn.macd) && isNum(sn.signal) && sn.macd > sn.signal)) return false;
      if (f.volAbove && !(isNum(sn.vma20) && sn.volume > sn.vma20)) return false;
      return true;
    });
  }
  function sortList(list, sort) {
    const m = sort.dir === 'asc' ? 1 : -1;
    const val = { score: (s) => (s.score.ok ? s.score.total : null), change: (s) => s.snap.changePct, code: (s) => s.code }[sort.key];
    return list.slice().sort((a, b) => {
      const va = val(a), vb = val(b);
      if (va == null && vb == null) return a.code.localeCompare(b.code, 'en', { numeric: true });
      if (va == null) return 1;
      if (vb == null) return -1;
      if (sort.key === 'code') return m * va.localeCompare(vb, 'en', { numeric: true });
      return m * (va - vb) || a.code.localeCompare(b.code, 'en', { numeric: true });
    });
  }

      q: String(fd.get('q') || ''), minScore: num('minScore', 0), rsiMin: num('rsiMin', 0), rsiMax: num('rsiMax', 100),

  function mountCompareChart(list) {
    const dates = commonDates(list);
    const p = PERIODS.find((x) => x.key === state.comparePeriod);
    let win = dates, short = false;
    if (dates.length) {
      const cutoff = C.addMonthsISO(dates[dates.length - 1], -p.months);
      const k = dates.findIndex((d) => d > cutoff);
      win = dates.slice(k < 0 ? dates.length - 1 : k);
      short = dates[0] > cutoff;
    }
    const maps = list.map((s) => new Map(s.rows.map((r) => [r.date, r.close])));
    const series = list.map((s, k) => {
      const base = win.length ? maps[k].get(win[0]) : 1;
      return Object.assign({ name: `${s.code} ${s.name}`, code: s.code, values: win.map((d) => (maps[k].get(d) / base) * 100), raw: win.map((d) => maps[k].get(d)) }, SERIES[k]);
    });
    const ok = win.length >= 2;
    const chart = new Charts.LineChart($('#cvCompare'), $('#cmpBody .cmp-box .chart-tip'), {
      base: 100,
      tipHTML: (i) => `<div class="tip-date">${win[i]}</div>` + series.map((s, k) => `<div class="tip-row">${markerSVG(k)}<span>${esc(s.code)}</span><span class="v">${fNum(s.values[i])}<span class="muted">（${fPrice(s.raw[i])}）</span></span></div>`).join('')
    });
    chart.setData(win, ok ? series : []);
    chart.draw();
    observe($('#cmpBody .cmp-box'), () => chart.draw());
    $('#cmpLegend').innerHTML = series.map((s, k) => `<span>${markerSVG(k)}${esc(s.name)}（${SERIES[k].style}）${ok ? `<b class="tabular">${fNum(s.values[s.values.length - 1])}</b>` : ''}</span>`).join('');
    const note = $('#cmpNote');
    if (!dates.length) note.textContent = '這些股票沒有共同的交易日期，無法對齊比較走勢。';
    else if (!ok) note.textContent = `所選期間內只有 ${win.length} 個共同交易日，無法繪製走勢。`;
    else note.textContent = `共同交易日 ${win.length} 天（${win[0]} ～ ${win[win.length - 1]}），以 ${win[0]} 的收盤價為 100。${short ? `共同資料少於所選的 ${p.label}，顯示全部共同期間。` : ''}`;
    $('#cvCompare').setAttribute('aria-label', ok ? `標準化價格走勢圖，${win[0]} 至 ${win[win.length - 1]}，期末數值：${series.map((s) => `${s.name} ${fNum(s.values[s.values.length - 1])}`).join('，')}。可用左右方向鍵逐日查看。` : '標準化價格走勢圖：共同交易日不足');
  }

  function bindDrop() {
    const z = $('#dropZone');
    if (!z) return;
    ['dragenter', 'dragover'].forEach((t) => z.addEventListener(t, (e) => { e.preventDefault(); z.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((t) => z.addEventListener(t, (e) => { e.preventDefault(); z.classList.remove('over'); }));
    z.addEventListener('drop', (e) => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) readFile(f); });
  }
  function prefillFromName(fileName) {
    const d = state.draft;
    if (d.code && !d.autoFilled) return;
    const base = fileName.replace(/\.[^.]+$/, '');
    const m = base.match(/^([0-9A-Za-z]{2,12})(?:[_\-\s]+(.+))?$/);
    if (!m) return;
    d.code = m[1].toUpperCase();
    d.name = m[2] ? m[2].slice(0, 20) : d.autoFilled ? '' : d.name;
    d.autoFilled = true;
  }
  function readFile(file) {
    const d = state.draft;
    const fail = (msg) => {
      d.text = null; d.validation = null; d.fileName = file.name; d.size = file.size;
      state.lastResult = `<div class="notice error"><div><strong>無法使用這個檔案</strong>：${esc(msg)}</div></div>`;
      if (state.route.view === 'import') renderImport();
    };
    if (file.size > 5 * 1024 * 1024) { fail('檔案超過 5 MB 上限。'); return; }
    if (!/\.csv$/i.test(file.name) && !/csv/i.test(file.type || '')) { fail(`「${file.name}」不是 CSV 檔案，請選擇副檔名為 .csv 的檔案。`); return; }
    const reader = new FileReader();
    reader.onload = () => {
      d.text = String(reader.result || '');
      d.fileName = file.name; d.size = file.size;
      prefillFromName(file.name);
      d.validation = C.validateCSV(d.text);
      state.lastResult = d.validation.ok ? previewHTML(d.validation.info) : errorHTML(d.validation, '檔案檢查未通過');
      if (state.route.view === 'import') renderImport();
    };
    reader.onerror = () => fail('無法讀取檔案內容。');
    reader.readAsText(file);
  }
  function showImportMsg(html) {
    state.lastResult = html;
    const box = $('#impResult');
    if (box) box.innerHTML = html;
  }
  function doImport() {
    const d = state.draft;
    const code = (d.code || '').trim().toUpperCase();
    if (!d.text) { showImportMsg('<div class="notice warn">請先選擇 CSV 檔案，或使用右側的範例檔。</div>'); return; }
    if (!/^[0-9A-Z][0-9A-Z._-]{0,11}$/.test(code)) {
      showImportMsg('<div class="notice warn">請輸入股票代號：1～12 個英文字母或數字，例如 2330。</div>');
      $('#impCode').focus();
      return;
    }
    const v = d.validation || C.validateCSV(d.text);
    if (!v.ok) { showImportMsg(errorHTML(v, '匯入失敗')); return; }
    const res = importStock({ code, name: (d.name || '').trim(), rows: v.rows, fileName: d.fileName, unit: d.unit });
    state.lastResult = successHTML(res.st, v.info, res.replaced);
    state.draft = emptyDraft(d.unit);
    renderImport();
    toast(`已匯入 ${esc(code)}，共 ${v.info.count} 筆`);
  }
  function loadSample(key) {

    state.lastResult = successHTML(res.st, v.info, res.replaced);
    renderImport();
    toast(`已匯入 ${s.code} ${s.name}，共 ${v.info.count} 筆`);
  }
  function removeImported(code) {
    const st = state.stocks.get(code);
    if (!st || st.source !== 'csv') return;
    if (state.demoBackup.has(code)) {
      state.stocks.set(code, state.demoBackup.get(code));

      toast(`已移除匯入資料，${esc(code)} 恢復為示範資料`);

      state.compare = state.compare.filter((c) => c !== code);
      if (state.current === code) { state.current = state.order[0]; updateNavStock(); }
      toast(`已移除匯入資料：${esc(code)}`);
    }
    updateBanner();
    state.lastResult = null;
    renderImport();
  }

        <section class="card" aria-labelledby="a3"><h2 id="a3">技術指標計算方式</h2>
